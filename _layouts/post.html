---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" class="timeago">{{ page.date | date: "%B %d, %Y" }}</time>
      {% if page.tags and page.tags.size > 0 %}
      <span class="tag-sep">·</span>
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      {% endif %}
    </div>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <a href="{{ '/' | relative_url }}" class="back-link">← All posts</a>
</article>
