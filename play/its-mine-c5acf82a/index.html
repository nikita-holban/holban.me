<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no, shrink-to-fit=yes">
  <title>It's Mine!</title>
  <!-- No favicon request (avoids a 404 in the console on every host). -->
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#000000">
  <!-- Opened from a phone's home screen, the game runs without the browser bars. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    /* Fills whatever iframe/window the portal gives us; no footer, logo or custom fullscreen button. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* Touches belong to the game: no page zoom, scrolling, pull-to-refresh, text selection, magnifier or tap flash. */
    html, body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
                 -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #231F20; touch-action: none; outline: none; }
    #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(60vw, 320px); }
    #unity-progress-bar-empty { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; }
    #unity-progress-bar-full { height: 100%; width: 0; background: #fff; transition: width .15s; }
    #unity-warning { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); font: 14px system-ui, sans-serif; color: #fff; }
    #unity-warning div { padding: 8px 12px; margin-bottom: 6px; border-radius: 4px; background: rgba(160, 40, 40, .9); }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="unity-loading-bar"><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
  <div id="unity-warning"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      if (type !== "error") { console.warn(msg); return; }
      var div = document.createElement("div");
      div.textContent = msg;
      warningBanner.appendChild(div);
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/53f5c9b6cb8aa98b8c8b385f1d9b1fb7.data.unityweb",
      frameworkUrl: buildUrl + "/e2854cff6c6c0f55844d73e4bfc29fc8.framework.js.unityweb",
      codeUrl: buildUrl + "/f5562911592b2ccd6a869becd18559d2.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "It's Mine!",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
      // A bare "Script error." with no file comes from scripts the browser injects into every page (Firefox for
      // iOS does, about 2 s in) and leaves the game running. Unity would stop on it with an alert, so skip those;
      // returning false keeps Unity's own handling for everything else.
      errorHandler: function (message, filename) {
        if (!filename && /^\s*Script error\.?\s*$/.test(String(message))) {
          console.warn("ignored page error without a source: " + message);
          return true;
        }
        return false;
      },
      // Phones pack 2-3 pixels into each CSS pixel; rendering all of them costs a lot of speed for little gain.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };

    // A long press (or right click) must not open the browser's menu over the game.
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    // Phones and tablets. iPadOS Safari presents itself as a Mac, but a Mac has no touch screen.
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
      || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
    var topLevel = (function () { try { return window.self === window.top; } catch (e) { return false; } })();
    // Opened directly on a phone (not inside a portal iframe): on a tap, go fullscreen and lock to landscape where
    // the browser allows it (Android Chrome). Portals (CrazyGames, GameDistribution, itch) own fullscreen and
    // orientation, and CrazyGames forbids a game-made fullscreen, so inside an iframe we leave it to them.
    // iPhone Safari can do neither; the game itself shows a "turn your phone" card when held upright.
    if (isMobile && topLevel) {
      document.addEventListener("touchend", function () {
        var el = document.documentElement;
        var request = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!request || document.fullscreenElement || document.webkitFullscreenElement) return;
        var entered = request.call(el);
        if (entered && entered.then) entered.then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
        }).catch(function () {});
      }, { passive: true });
    }

    var script = document.createElement("script");
    script.src = buildUrl + "/2c7a38d8edbb03f1e9173757afb8f9f4.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
        window.unityInstance = unityInstance;
        canvas.focus();
      }).catch(function (message) {
        unityShowBanner(String(message), "error");
      });
    };
    document.body.appendChild(script);
    // Keep keyboard input working inside portal iframes after clicks.
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
